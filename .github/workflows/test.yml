name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and TUI dependency
        run: python -m pip install ".[tui]"
      - name: Compile source
        run: python -m compileall -q ffiv3d_save_tool.py ffiv3d_save_tui.py ffiv3d_save_gui.py tests
      - name: Run core and TUI tests
        run: python -m unittest discover -v

  gui-smoke:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and GUI dependency
        run: python -m pip install ".[gui]"
      - name: Run GUI smoke tests
        run: python -m unittest tests.test_gui -v
