[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffiv3d-save-tool"
version = "0.5.0"
description = "CLI, TUI, and GUI SAVE.BIN editor for Final Fantasy IV 3D Remake PC saves."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-3.0-or-later" }
keywords = ["ffiv", "final-fantasy", "save-editor", "checksum"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
ffiv3d-save-tool = "ffiv3d_save_tool:main"
ffiv3d-save-tui = "ffiv3d_save_tui:main"

[project.gui-scripts]
ffiv3d-save-gui = "ffiv3d_save_gui:main"

[project.optional-dependencies]
tui = ["textual>=8.0.0"]
gui = ["PySide6-Essentials>=6.5.0"]

[project.urls]
UpstreamReference = "https://github.com/KingCyrus20/FFIV-Save-Editor"

[tool.setuptools]
py-modules = ["ffiv3d_save_gui", "ffiv3d_save_tool", "ffiv3d_save_tui"]

[tool.black]
line-length = 100
